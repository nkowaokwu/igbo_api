name: Lint

on: push

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Use Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Node.js dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint ./src

      - name: Run TS
        run: npx tsc --noEmit